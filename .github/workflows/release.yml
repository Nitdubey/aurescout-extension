name: Build & Release Chrome Extension

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build
        env:
          VITE_API_BASE: https://www.aurescout.com

      - name: Create zip
        run: npm run zip
        env:
          VITE_API_BASE: https://www.aurescout.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurescout-extension-chrome
          path: .output/aurescout-extension-*.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & zip
        run: npm run zip
        env:
          VITE_API_BASE: https://www.aurescout.com

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: .output/aurescout-extension-*.zip
          generate_release_notes: true
          body: |
            ## AureScout Chrome Extension ${{ github.ref_name }}

            ### 🚀 Install Instructions
            1. Download `aurescout-extension-*-chrome.zip` below
            2. Unzip it
            3. Open `chrome://extensions/`
            4. Enable **Developer Mode**
            5. Click **Load unpacked** → select the unzipped folder

            ### 📦 Chrome Web Store
            Coming soon — [aurescout.com/extension](https://www.aurescout.com/extension)
